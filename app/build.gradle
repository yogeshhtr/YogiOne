plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yogi.one'
    compileSdk 34

    defaultConfig {
        applicationId "com.yogi.one"
        minSdk 21
        targetSdk 34
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode run
        versionName "2.${run}"
    }

    // Same key for every build, so a new APK installs OVER the old one (keeps your data).
    signingConfigs {
        yogi {
            storeFile rootProject.file('yogione.p12')
            storePassword 'yogitv-private'
            keyAlias 'yogi'
            keyPassword 'yogitv-private'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.yogi }
        release {
            minifyEnabled false
            signingConfig signingConfigs.yogi
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    // QR: Google's scanner (no camera permission, runs in Play services) + ZXing to draw QR codes
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.3.3'
}
