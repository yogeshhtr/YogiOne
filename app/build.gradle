plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yogi.one'
    compileSdk 34

    defaultConfig {
        applicationId "com.yogi.one"
        minSdk 21
        targetSdk 34
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode run
        versionName "1.${run}"
    }

    // Same key for every build, so a new APK installs OVER the old one (keeps your data).
    signingConfigs {
        yogi {
            storeFile rootProject.file('yogione.p12')
            storePassword 'yogitv-private'
            keyAlias 'yogi'
            keyPassword 'yogitv-private'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.yogi }
        release {
            minifyEnabled false
            signingConfig signingConfigs.yogi
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
